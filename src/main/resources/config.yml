# 管理者ショップの設定。
#
# 価格の考え方:
#   Jobs Reborn の1時間あたり収入上限が 1000+500*(合計レベル/100) に設定されているため
#   (spsmc-infra/plugins/Jobs/generalConfig.yml)、駆け出しのプレイヤーで時給はおよそ1000。
#   護符1個の初期価格 1500 は、そのおよそ1時間半ぶんの稼ぎにあたる。
#   高すぎて誰も買わない、安すぎて死が怖くなくなる、のどちらにも寄らない位置に置いている。

shop:
  title: "&8[&6管理者ショップ&8]"
  # 9の倍数で、最大54。
  size: 27

# 金額表示。EssentialsX の currency-symbol と揃えておく。
currency:
  symbol: "S"
  # true なら 1500S、false なら S1500 と表示する。
  suffix: true

protection:
  # プレイヤーに殺されたときも護符を発動させるか。
  # このサーバーはクレーム内でPvPを止めているため通常は起きないが、
  # 「持っているだけで必ず発動する」という説明を崩さないよう既定では発動させる。
  protect-on-pvp-death: true

  # 護符が守る範囲。既定は防具4枠・左手・ホットバー9枠の合計14枠。
  keep-armor: true
  keep-offhand: true
  keep-hotbar: true

  # 発動をサーバー全体に知らせる。DiscordSRV が入っていればDiscordにも流れる。
  broadcast: false

# サーバー全体に一定時間だけ効く商品（豊穣の鐘・溶鉱の号鐘・鉱脈の号鐘・疾風の笛）に共通の設定。
boosts:
  # 同じ種類を重ねられる上限（分）。これを超える延長は断る。上限は種類ごとに別々に数える。
  # 上限がないと、まとめ買いした人が丸一日ぶん先に積んでしまい、他の人が使う機会がなくなる。
  max-total-minutes: 120
  # 効果が続いている間、全員のボスバーに残り時間を出す。
  boss-bar: true

# 売り物。キーが商品IDになる。
items:
  return_charm:
    slot: 16
    material: RECOVERY_COMPASS
    display-name: "&b帰還の護符"
    lore:
      - "&7メインハンドに持って右クリックすると、"
      - "&7自分が最後に死んだ場所の近くへ戻る。"
      - "&7移動に成功すると1個消える。"
      - ""
      - "&7近くに安全な足場がなければ使用できない。"
      - "&7落とした持ち物が残っている保証はない。"
    price: 500.0
    amount: 1
    glow: true
    perk: return_charm

  keepsake_charm:
    # ショップGUIの何番目の枠に置くか（0始まり）。
    slot: 11
    # 不死のトーテムは使わない。手に持っているとバニラの復活効果が先に働いてしまい、
    # そもそも死亡しないため護符が発動しないという分かりにくい挙動になる。
    material: HEART_OF_THE_SEA
    display-name: "&e身代わりの護符"
    lore:
      - "&7死んだとき、身に着けている防具と"
      - "&7左手・ホットバーの中身だけが手元に残る。"
      - ""
      - "&7持ち物の中に入れておくだけで働く。"
      - "&7手に持つ必要はない。死ぬと1個消える。"
      - ""
      - "&7それ以外の持ち物と経験値は通常どおり失う。"
    price: 1500.0
    # 購入時に渡す個数。
    amount: 1
    # エンチャント光沢を付ける。
    glow: true
    # 効果の種類。効果そのものは Java 側の実装が要る。
    perk: keepsake_charm

  harvest_bell:
    slot: 12
    material: BELL
    display-name: "&a豊穣の鐘"
    lore:
      - "&7右クリックで鳴らすと、サーバー全体の"
      - "&7農作物の成長が30分間だけ2倍になる。"
      - ""
      - "&7効果は現実の時間で数える。"
      - "&7自分だけでなく、その時間に居合わせた"
      - "&7全員の畑が早く育つ。"
      - ""
      - "&7効果が続いている間に鳴らすと延長する。"
    price: 3000.0
    amount: 1
    glow: true
    perk: growth_boost
    perk-options:
      # 1回あたりの持続時間（分、現実時間）。
      duration-minutes: 30
      # 成長の倍率。2 なら、作物が1段階育つたびにもう1段階進む。
      multiplier: 2

  smelting_bell:
    slot: 13
    material: BLAST_FURNACE
    display-name: "&c溶鉱の号鐘"
    lore:
      - "&7右クリックで鳴らすと、サーバー全体の"
      - "&7かまど・溶鉱炉・燻製器が30分間だけ"
      - "&72倍の速さで焼き上がる。"
      - ""
      - "&7燃料の減りは変わらない。"
      - "&7効いているのは、鳴らしたあとに"
      - "&7新しく焼き始めたぶんだけ。"
      - ""
      - "&7効果が続いている間に鳴らすと延長する。"
    price: 3000.0
    amount: 1
    glow: true
    perk: smelt_boost
    perk-options:
      duration-minutes: 30
      # 焼き上がりの速さの倍率。2 なら調理時間が半分になる。
      multiplier: 2

  mining_bell:
    slot: 14
    material: DEEPSLATE_DIAMOND_ORE
    display-name: "&b鉱脈の号鐘"
    lore:
      - "&7右クリックで鳴らすと、居合わせた全員に"
      - "&730分間だけ採掘速度上昇が付く。"
      - ""
      - "&7鳴らした人だけは1段階上になる。"
      - "&7効果中に鳴らした人は全員が対象。"
      - ""
      - "&7効果が続いている間に鳴らすと延長する。"
    price: 3000.0
    amount: 1
    glow: true
    perk: mining_boost
    perk-options:
      duration-minutes: 30
      # 全員に付く採掘速度上昇の表示レベル。鳴らした人はこれより1段階上になる。
      level: 1

  gale_flute:
    slot: 15
    material: GOAT_HORN
    display-name: "&e疾風の笛"
    lore:
      - "&7右クリックで吹くと、居合わせた全員に"
      - "&720分間だけ移動速度上昇が付く。"
      - ""
      - "&7吹いた人だけは1段階上になり、"
      - "&7落下ダメージを和らげる効果も付く。"
      - ""
      - "&7効果が続いている間に吹くと延長する。"
    price: 2000.0
    amount: 1
    glow: true
    perk: speed_boost
    perk-options:
      duration-minutes: 20
      # 全員に付く移動速度上昇の表示レベル。吹いた人はこれより1段階上になる。
      level: 1
